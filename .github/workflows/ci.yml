name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    # macos-15 ships Xcode 16 / Swift 6. Older images default to Swift 5.10,
    # which cannot parse this package's swift-tools-version: 6.0 manifest.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

  examples:
    name: Build examples
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The examples depend on the root package by path, so a breaking API
      # change shows up here rather than in someone's clone.
      - name: Build ChatDemo
        working-directory: Examples/ChatDemo
        run: swift build

      - name: Build PrivacyChat
        working-directory: Examples/PrivacyChat
        run: swift build

  docs:
    name: Build documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Catches broken DocC symbol links (``Foo``) and dead <doc:> references,
      # which are otherwise only discovered after Swift Package Index builds.
      - name: Generate DocC
        run: |
          swift package resolve
          xcrun xcodebuild docbuild \
            -scheme FoundationModelsKit \
            -destination 'generic/platform=macOS' \
            -derivedDataPath /tmp/docbuild
