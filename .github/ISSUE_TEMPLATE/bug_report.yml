name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **privacy routing** issue — a request going somewhere its
        `privacySensitivity` should not allow — please report it privately via
        [Security Advisories](https://github.com/divyaravitech/FoundationModelsKit/security/advisories/new)
        instead. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest code that shows the problem. `MockLanguageModel` is usually
        enough — please avoid requiring an API key to reproduce.
      render: swift
      placeholder: |
        let router = ModelRouter(onDevice: MockLanguageModel())
        let response = try await router.sendMessage(
            request: ModelRequest(content: "…", privacySensitivity: .high)
        )
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FoundationModelsKit version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and Swift version
      description: Output of `swift --version`, plus the OS you are running on.
      placeholder: "Swift 6.0, macOS 15.2"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Which backend
      multiple: true
      options:
        - MockLanguageModel
        - OnDeviceLanguageModel
        - AnthropicLanguageModel
        - A custom backend
        - Not backend-specific
    validations:
      required: true
